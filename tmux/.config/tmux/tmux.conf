# Enable True color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -gq allow-passthrough on

# General settings
set -g base-index 1
set -g pane-base-index 1
set -g detach-on-destroy off

# Prefix
set-option -g prefix C-b
set-option -g prefix2 none

# Utility bindings
unbind r
bind r source-file ~/.config/tmux/tmux.conf

unbind %
bind | split-window -h -c "#{pane_current_path}"

unbind '"'
bind - split-window -v -c "#{pane_current_path}"

unbind v
bind v copy-mode

# Pane resizing
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

bind -r m resize-pane -Z

# Kill pane without confirmation
bind x kill-pane

# Mouse
set -g mouse on

# Vim-style copy mode
set-window-option -g mode-keys vi
bind -T copy-mode-vi 'v' send -X begin-selection
bind -T copy-mode-vi 'y' send -X copy-selection

# New session
bind n command-prompt "new-session -s '%%'"

# Drag copy using mouse
unbind -T copy-mode-vi MouseDragEnd1Pane


# ==========================
# Plugins
# ==========================

set-environment -g TMUX_PLUGIN_MANAGER_PATH ~/.config/tmux/.tmux/plugins

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin "christoomey/vim-tmux-navigator"
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-online-status'
set -g @plugin 'tmux-plugins/tmux-battery'

# ==========================
# Catppuccin
# ==========================

set -g @catppuccin_flavor "mocha"
set -g @catppuccin_status_background "none"
set -g @catppuccin_window_status_style "none"
set -g @catppuccin_pane_status_enabled "off"
set -g @catppuccin_pane_border_status "off"


# ==========================
# Online Status
# ==========================

set -g @online_icon "ok"
set -g @offline_icon "nok"


# ==========================
# Transparent Status Bar
# ==========================

set -g status-left-length 100
set -g status-left ""

set -ga status-left "#{?client_prefix,#[fg=#{@thm_red},bold]  #S ,#[fg=#{@thm_green}]  #S }"
set -ga status-left "#[fg=#{@thm_overlay_0}]#{?window_zoomed_flag,│,}"
set -ga status-left "#[fg=#{@thm_yellow}]#{?window_zoomed_flag,  zoom ,}"


set -g status-right-length 250
set -g status-right ""

set -ga status-right "#{?#{==:#{online_status},ok},#[fg=#{@thm_rosewater}] 󰖩 on ,#[fg=#{@thm_red},bold]#[reverse] 󰖪 off }"


# ==========================
# Tmux Appearance
# ==========================

set -g status-position bottom
set -g status-style "bg=default"
set -g status-left-style "bg=default"
set -g status-right-style "bg=default"
set -g status-justify "absolute-centre"


# ==========================
# Window Appearance
# ==========================

set -wg automatic-rename on
set -g automatic-rename-format "#{pane_current_command}"

set -g window-status-format " #I#{?#{!=:#{window_name},Window},: #W,} "
set -g window-status-style "bg=default,fg=#{@thm_overlay_0}"
set -g window-status-last-style "bg=default,fg=#{@thm_overlay_1}"

set -g window-status-activity-style "bg=#{@thm_red},fg=#{@thm_bg}"
set -g window-status-bell-style "bg=#{@thm_red},fg=#{@thm_bg},bold"

set -gF window-status-separator "#[fg=#{@thm_overlay_0}]│"

set -g window-status-current-format " #I#{?#{!=:#{window_name},Window},: #W,} "
set -g window-status-current-style "bg=#{@thm_blue},fg=#{@thm_bg},bold"


# TPM must stay last
run '~/.config/tmux/.tmux/plugins/tpm/tpm'

